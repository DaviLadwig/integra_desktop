[package]
name = "integra-desktop"
version = "0.3.2"
description = "Integra - Sistema de produção isolada"
authors = ["Integra"]
edition = "2021"

[lib]
name = "integra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
