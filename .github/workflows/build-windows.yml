name: Gerar e publicar Integra para Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') { npm ci }
          else { npm install --no-audit --no-fund }

      - name: Validar assinatura obrigatoria
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Defina TAURI_SIGNING_PRIVATE_KEY em Settings > Secrets and variables > Actions.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Defina TAURI_SIGNING_PRIVATE_KEY_PASSWORD para a chave privada protegida.'
          }
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$config.plugins.updater.pubkey) -or $config.plugins.updater.pubkey -eq '__INTEGRA_UPDATER_PUBKEY__') {
            throw 'Execute o script de geracao de chaves e publique a chave publica no tauri.conf.json.'
          }
          $version = [string]$config.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG diferente da versao $version."
          }

      - name: Gerar EXE e MSI assinados
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis,msi

      - name: Gerar latest.json para o atualizador
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $msis = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi')
          if ($msis.Count -ne 1) { throw 'Era esperado exatamente um instalador MSI.' }
          $msi = $msis[0]
          $sigPath = "$($msi.FullName).sig"
          if (!(Test-Path $sigPath)) { throw 'MSI sem assinatura de atualizacao.' }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $version = [string](Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:RELEASE_TAG } else { "v$version" }
          $notes = (Get-Content 'CHANGELOG_RELEASE.md' -Raw).Trim()
          $manifest = @{
            version = $version
            notes = $notes
            pub_date = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($msi.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content 'latest.json' -Encoding utf8

      - name: Disponibilizar instaladores e assinaturas no Actions
        uses: actions/upload-artifact@v4
        with:
          name: Integra-Windows-Assinado
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          if-no-files-found: error

      - name: Publicar Release ao criar tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @((Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi').FullName)
          $files += @((Get-ChildItem 'src-tauri/target/release/bundle/msi/*.sig').FullName)
          $files += @((Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe').FullName)
          $files += @((Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.sig').FullName)
          $files += (Resolve-Path 'latest.json').Path
          gh release create $env:RELEASE_TAG @files --verify-tag --latest --title "Integra $env:RELEASE_TAG" --notes-file 'CHANGELOG_RELEASE.md'
