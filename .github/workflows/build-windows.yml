name: Gerar Integra para Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      # Sem cache-dependency-path: o repositorio pode nao conter package-lock.json.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      # Usa diretamente o CLI do Tauri, evitando duplicar o argumento --bundles
      # do script npm run build (que ja inclui --bundles nsis).
      - name: Gerar instaladores NSIS e MSI
        run: npm run tauri -- build --bundles nsis,msi

      - name: Publicar instalador EXE (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: Integra-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar instalador MSI
        uses: actions/upload-artifact@v4
        with:
          name: Integra-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
